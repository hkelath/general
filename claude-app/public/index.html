<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCLTech Sales Intelligence</title>
<style>
:root {
  --bg:         #060d18;
  --navy:       #001A3A;
  --navy-mid:   #0a1e36;
  --navy-light: #0d2545;
  --orange:     #F37021;
  --orange-dim: rgba(243,112,33,0.15);
  --blue:       #00ADEF;
  --text:       #E9ECF0;
  --muted:      #7C8A99;
  --border:     rgba(255,255,255,0.08);
  --radius:     10px;
  --card:       #0a1e36;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--navy-light);border-radius:3px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ── Navbar ── */
.navbar{background:var(--navy);border-bottom:2px solid var(--orange);padding:0 24px;height:60px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.4)}
.navbar-logo{height:30px;object-fit:contain}
.navbar-divider{width:1px;height:28px;background:rgba(255,255,255,.18)}
.navbar-title{font-size:.98rem;font-weight:700;color:var(--text)}
.navbar-sub{font-size:.7rem;color:var(--orange);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px}
.navbar-spacer{flex:1}
.health-group{display:flex;align-items:center;gap:8px}
.health-item{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--muted)}
.health-dot{width:7px;height:7px;border-radius:50%;background:#4B5563;transition:background .3s}
.health-dot.ok{background:#22C55E}
.health-dot.warn{background:#F59E0B}

/* ── Layout ── */
.main{max-width:1380px;margin:0 auto;padding:28px 24px}

/* ── Input section ── */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;margin-bottom:20px}
.panel-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:18px}
.mode-tabs{display:flex;gap:5px;background:var(--bg);border-radius:8px;padding:4px;width:fit-content;margin-bottom:20px}
.mode-tab{padding:7px 18px;border-radius:6px;border:none;background:none;color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
.mode-tab.active{background:var(--orange);color:#fff}
.mode-tab:not(.active):hover{color:var(--text)}

.form-row{display:flex;gap:12px;margin-bottom:14px}
.form-group{flex:1}
.form-label{font-size:.73rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:block;font-weight:600}
.form-input,.form-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 13px;font-size:.9rem;outline:none;transition:border-color .15s;font-family:inherit}
.form-input:focus,.form-textarea:focus{border-color:var(--orange)}
.form-textarea{resize:vertical;min-height:92px;line-height:1.55}
.form-hint{font-size:.74rem;color:var(--muted);margin-top:5px;line-height:1.5}

.btn{padding:9px 20px;border-radius:7px;border:none;font-weight:700;font-size:.88rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:#d9611d}
.btn-primary:disabled{background:#5a3010;color:#6B7280;cursor:not-allowed}
.btn-secondary{background:var(--navy);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--orange);color:var(--orange)}
.btn-sm{padding:6px 13px;font-size:.78rem}

/* ── Progress ── */
.progress-panel{display:none}
.progress-panel.visible{display:block}
.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.progress-title{font-weight:700;font-size:.92rem}
.progress-count{font-size:.8rem;color:var(--muted)}
.prog-bar-outer{background:var(--bg);border-radius:4px;height:5px;margin-bottom:14px;overflow:hidden}
.prog-bar-inner{background:var(--orange);height:100%;border-radius:4px;transition:width .5s ease}
.chip-list{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.78rem;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.chip.researching{border-color:var(--blue);color:var(--blue)}
.chip.analysing{border-color:var(--orange);color:var(--orange)}
.chip.retrying{border-color:#F59E0B;color:#F59E0B}
.chip.done{border-color:#22C55E;color:#22C55E}
.chip.error{border-color:#EF4444;color:#EF4444}
.spinner{width:9px;height:9px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Results header ── */
.results-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.results-title{font-size:1rem;font-weight:700;color:var(--text)}
.export-bar{display:flex;gap:8px;flex-wrap:wrap}

/* ── Org grid ── */
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:22px}
.org-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all .15s;position:relative}
.org-card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.org-card.selected{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-dim)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.card-name{font-size:.95rem;font-weight:700;color:var(--text);line-height:1.3}
.score-pill{font-weight:800;font-size:.82rem;padding:2px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.score-high{background:#166534;color:#4ADE80}
.score-med{background:#7c2d12;color:#FB923C}
.score-low{background:#374151;color:#9CA3AF}
.card-industry{font-size:.76rem;color:var(--muted);margin-bottom:7px}
.card-summary{font-size:.8rem;color:#9CA3AF;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.tier-pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
.t-strategic{background:rgba(243,112,33,.18);color:var(--orange);border:1px solid rgba(243,112,33,.35)}
.t-trending{background:rgba(0,173,239,.12);color:var(--blue);border:1px solid rgba(0,173,239,.3)}
.t-other{background:rgba(107,114,128,.12);color:#9CA3AF;border:1px solid rgba(107,114,128,.25)}
.opp-count{font-size:.73rem;color:var(--muted)}

/* ── Detail view ── */
.detail-view{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:none}
.detail-view.visible{display:block}
.detail-hdr{background:var(--navy);padding:22px 28px;display:flex;align-items:flex-start;gap:18px;border-bottom:2px solid var(--orange)}
.detail-logo{width:50px;height:50px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;color:var(--orange);flex-shrink:0;overflow:hidden}
.detail-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.detail-org{font-size:1.4rem;font-weight:800;color:var(--text);margin-bottom:5px;line-height:1.2}
.detail-summary{font-size:.86rem;color:#9CA3AF;line-height:1.65;max-width:680px}
.detail-right{margin-left:auto;text-align:right;flex-shrink:0}
.score-big{font-size:2.1rem;font-weight:900;color:var(--orange);line-height:1}
.score-big span{font-size:1rem;color:var(--muted)}
.score-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.resell-tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(34,197,94,.12);color:#22C55E;border:1px solid rgba(34,197,94,.3);text-transform:uppercase;letter-spacing:.4px;margin-top:7px;display:inline-block}

.stats-bar{display:flex;background:var(--navy-mid);border-bottom:1px solid var(--border)}
.stat-cell{flex:1;padding:11px 16px;border-right:1px solid var(--border);text-align:center;min-width:0}
.stat-cell:last-child{border-right:none}
.stat-val{font-size:.92rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-lbl{font-size:.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ── Tabs ── */
.tabs-row{display:flex;border-bottom:1px solid var(--border);background:var(--navy-mid);padding:0 22px;overflow-x:auto}
.tab-btn{padding:12px 17px;color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;white-space:nowrap;transition:all .15s;font-family:inherit}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange)}

.tab-body{padding:24px 28px}

/* ── Shared inner styles ── */
.sec-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:10px;margin-top:18px}
.sec-label:first-child{margin-top:0}
.desc-text{font-size:.88rem;color:#9CA3AF;line-height:1.7;margin-bottom:16px}

.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.info-card{background:var(--bg);border-radius:7px;padding:11px 14px;border-left:3px solid var(--orange)}
.info-lbl{font-size:.67rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px;font-weight:600}
.info-val{font-size:.88rem;color:var(--text);line-height:1.4}

.tag-cloud{display:flex;flex-wrap:wrap;gap:7px}
.tech-tag{background:var(--navy);border:1px solid rgba(0,173,239,.3);color:var(--blue);font-size:.78rem;padding:4px 11px;border-radius:12px}

.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.person-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.person-av{width:36px;height:36px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--orange);font-size:.9rem;flex-shrink:0}
.person-name{font-weight:700;font-size:.88rem;color:var(--text)}
.person-title{font-size:.76rem;color:var(--muted);margin-top:2px;line-height:1.4}

.news-list{display:flex;flex-direction:column;gap:9px}
.news-item{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;padding:13px 15px}
.news-hl{font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:3px}
.news-date{font-size:.73rem;color:var(--muted)}
.news-sig{font-size:.8rem;color:#9CA3AF;margin-top:5px;line-height:1.55}

.ma-item{background:var(--bg);border:1px solid var(--border);border-left:3px solid #F59E0B;border-radius:8px;padding:13px 15px;margin-bottom:9px}
.ma-event{font-size:.88rem;font-weight:600;color:var(--text)}
.ma-impl{font-size:.8rem;color:#9CA3AF;margin-top:4px;line-height:1.5}

.opp-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:17px 18px;margin-bottom:13px;transition:border-color .15s}
.opp-card:hover{border-color:var(--orange)}
.opp-hdr{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.opp-title{font-size:.96rem;font-weight:700;color:var(--text);flex:1;min-width:150px}
.opp-score{font-weight:800;font-size:.82rem;padding:3px 10px;border-radius:12px;white-space:nowrap}
.opp-desc{font-size:.86rem;color:#9CA3AF;line-height:1.65;margin-bottom:13px}
.opp-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.opp-field{background:var(--navy-mid);border-radius:6px;padding:8px 11px}
.opp-flbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px;font-weight:600}
.opp-fval{font-size:.82rem;color:var(--text);line-height:1.45}
.tags-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px}
.t-lbl{font-size:.73rem;color:var(--muted);margin-right:2px}
.tag{font-size:.73rem;padding:2px 9px;border-radius:10px}
.to{background:rgba(243,112,33,.13);color:var(--orange);border:1px solid rgba(243,112,33,.28)}
.tb{background:rgba(0,173,239,.09);color:var(--blue);border:1px solid rgba(0,173,239,.22)}
.p3-bar{background:linear-gradient(90deg,rgba(243,112,33,.13),rgba(0,173,239,.08));border:1px solid rgba(243,112,33,.28);border-radius:7px;padding:9px 13px;font-size:.8rem;color:var(--orange);margin-top:9px}
.p3-bar strong{color:var(--text)}
.comp-box{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.22);border-radius:6px;padding:7px 11px;font-size:.78rem;color:#F87171;margin-top:8px}

.bullet-list{list-style:none;padding:0}
.bullet-list li{padding:8px 12px 8px 15px;margin-bottom:5px;background:var(--bg);border-radius:6px;border-left:3px solid var(--orange);font-size:.86rem;color:#CBD5E1;line-height:1.5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-ico{font-size:2.5rem;margin-bottom:10px;opacity:.35}

.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
  .form-row{flex-direction:column}
  .info-grid{grid-template-columns:1fr 1fr}
  .two-col{grid-template-columns:1fr}
  .opp-grid{grid-template-columns:1fr}
  .stats-bar{flex-wrap:wrap}
  .stat-cell{min-width:50%}
}
</style>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────── -->
<nav class="navbar">
  <img class="navbar-logo"
       src="https://www.hcltech.com/themes/custom/hcltech/images/hcltech-new-logo.svg"
       onerror="this.style.display='none'" alt="HCLTech">
  <div class="navbar-divider"></div>
  <div>
    <div class="navbar-title">Sales Intelligence</div>
    <div class="navbar-sub">Digital Business Services · ANZ</div>
  </div>
  <div class="navbar-spacer"></div>
  <div class="health-group">
    <div class="health-item"><div class="health-dot" id="h-claude"></div>Claude</div>
    <div class="health-item"><div class="health-dot" id="h-tavily"></div>Tavily</div>
    <div class="health-item"><div class="health-dot" id="h-apollo"></div>Apollo</div>
  </div>
</nav>

<!-- ── Main ───────────────────────────────────────────────────── -->
<div class="main">

  <!-- Input panel -->
  <div class="panel" id="inputPanel">
    <div class="panel-title">Research Target</div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="single"   onclick="switchMode('single')">Single Org</button>
      <button class="mode-tab"        data-mode="bulk"     onclick="switchMode('bulk')">Bulk (up to 20)</button>
      <button class="mode-tab"        data-mode="industry" onclick="switchMode('industry')">Industry Sweep</button>
    </div>

    <!-- Single -->
    <div id="form-single">
      <div class="form-row">
        <div class="form-group" style="flex:2">
          <label class="form-label" for="singleOrg">Organisation Name</label>
          <input class="form-input" id="singleOrg"
                 placeholder="e.g. Commonwealth Bank of Australia" autocomplete="off">
        </div>
      </div>
    </div>

    <!-- Bulk -->
    <div id="form-bulk" style="display:none">
      <div class="form-group">
        <label class="form-label" for="bulkOrgs">Organisation Names — one per line (max 20)</label>
        <textarea class="form-textarea" id="bulkOrgs"
                  placeholder="Commonwealth Bank of Australia&#10;Telstra&#10;Woolworths Group&#10;BHP Group"></textarea>
        <p class="form-hint">Each line is one organisation. Duplicates and blank lines are removed automatically.</p>
      </div>
    </div>

    <!-- Industry -->
    <div id="form-industry" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="industryName">Industry / Sector</label>
          <input class="form-input" id="industryName"
                 placeholder="e.g. Financial Services, Retail, Utilities">
        </div>
        <div class="form-group">
          <label class="form-label" for="regionName">Region (optional)</label>
          <input class="form-input" id="regionName"
                 placeholder="e.g. Australia, ANZ, APAC">
        </div>
      </div>
      <p class="form-hint">Claude will discover up to 20 leading companies in the sector, then analyse each one.</p>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-top:6px">
      <button class="btn btn-primary" id="analyzeBtn" onclick="handleAnalyze()">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
        </svg>
        Analyse
      </button>
      <span id="apiMsg" style="font-size:.78rem;color:var(--muted)"></span>
    </div>
  </div>

  <!-- Progress panel -->
  <div class="panel progress-panel" id="progressPanel">
    <div class="progress-head">
      <div class="progress-title" id="progTitle">Analysing…</div>
      <div class="progress-count" id="progCount"></div>
    </div>
    <div class="prog-bar-outer">
      <div class="prog-bar-inner" id="progBar" style="width:0%"></div>
    </div>
    <div class="chip-list" id="chipList"></div>
  </div>

  <!-- Results -->
  <div id="resultsSection" style="display:none">
    <div class="results-head">
      <div class="results-title" id="resultsTitle"></div>
      <div class="export-bar" id="exportBar"></div>
    </div>

    <!-- Multi-org grid -->
    <div class="org-grid" id="orgGrid"></div>

    <!-- Single-org detail -->
    <div class="detail-view" id="detailView">
      <div class="detail-hdr"  id="detailHdr"></div>
      <div class="stats-bar"   id="statsBar"></div>
      <div class="tabs-row"    id="tabsRow"></div>
      <div class="tab-body"    id="tabBody"></div>
    </div>
  </div>

</div><!-- /main -->

<script>
// ── JAVASCRIPT INJECTED IN SUBSEQUENT SUB-TASKS ──
</script>
</body>
</html>
