<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCLTech Sales Intelligence</title>
<style>
:root {
  --bg:         #060d18;
  --navy:       #001A3A;
  --navy-mid:   #0a1e36;
  --navy-light: #0d2545;
  --orange:     #F37021;
  --orange-dim: rgba(243,112,33,0.15);
  --blue:       #00ADEF;
  --text:       #E9ECF0;
  --muted:      #7C8A99;
  --border:     rgba(255,255,255,0.08);
  --radius:     10px;
  --card:       #0a1e36;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--navy-light);border-radius:3px}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ── Navbar ── */
.navbar{background:var(--navy);border-bottom:2px solid var(--orange);padding:0 24px;height:60px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.4)}
.navbar-logo{height:30px;object-fit:contain}
.navbar-divider{width:1px;height:28px;background:rgba(255,255,255,.18)}
.navbar-title{font-size:.98rem;font-weight:700;color:var(--text)}
.navbar-sub{font-size:.7rem;color:var(--orange);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px}
.navbar-spacer{flex:1}
.health-group{display:flex;align-items:center;gap:8px}
.health-item{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--muted)}
.health-dot{width:7px;height:7px;border-radius:50%;background:#4B5563;transition:background .3s}
.health-dot.ok{background:#22C55E}
.health-dot.warn{background:#F59E0B}

/* ── Layout ── */
.main{max-width:1380px;margin:0 auto;padding:28px 24px}

/* ── Input section ── */
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;margin-bottom:20px}
.panel-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:18px}
.mode-tabs{display:flex;gap:5px;background:var(--bg);border-radius:8px;padding:4px;width:fit-content;margin-bottom:20px}
.mode-tab{padding:7px 18px;border-radius:6px;border:none;background:none;color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s}
.mode-tab.active{background:var(--orange);color:#fff}
.mode-tab:not(.active):hover{color:var(--text)}

.form-row{display:flex;gap:12px;margin-bottom:14px}
.form-group{flex:1}
.form-label{font-size:.73rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:block;font-weight:600}
.form-input,.form-textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:9px 13px;font-size:.9rem;outline:none;transition:border-color .15s;font-family:inherit}
.form-input:focus,.form-textarea:focus{border-color:var(--orange)}
.form-textarea{resize:vertical;min-height:92px;line-height:1.55}
.form-hint{font-size:.74rem;color:var(--muted);margin-top:5px;line-height:1.5}

.btn{padding:9px 20px;border-radius:7px;border:none;font-weight:700;font-size:.88rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:#d9611d}
.btn-primary:disabled{background:#5a3010;color:#6B7280;cursor:not-allowed}
.btn-secondary{background:var(--navy);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--orange);color:var(--orange)}
.btn-sm{padding:6px 13px;font-size:.78rem}

/* ── Progress ── */
.progress-panel{display:none}
.progress-panel.visible{display:block}
.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.progress-title{font-weight:700;font-size:.92rem}
.progress-count{font-size:.8rem;color:var(--muted)}
.prog-bar-outer{background:var(--bg);border-radius:4px;height:5px;margin-bottom:14px;overflow:hidden}
.prog-bar-inner{background:var(--orange);height:100%;border-radius:4px;transition:width .5s ease}
.chip-list{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.78rem;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.chip.researching{border-color:var(--blue);color:var(--blue)}
.chip.analysing{border-color:var(--orange);color:var(--orange)}
.chip.retrying{border-color:#F59E0B;color:#F59E0B}
.chip.done{border-color:#22C55E;color:#22C55E}
.chip.error{border-color:#EF4444;color:#EF4444}
.spinner{width:9px;height:9px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Results header ── */
.results-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.results-title{font-size:1rem;font-weight:700;color:var(--text)}
.export-bar{display:flex;gap:8px;flex-wrap:wrap}

/* ── Org grid ── */
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:22px}
.org-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all .15s;position:relative}
.org-card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.org-card.selected{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-dim)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.card-name{font-size:.95rem;font-weight:700;color:var(--text);line-height:1.3}
.score-pill{font-weight:800;font-size:.82rem;padding:2px 10px;border-radius:12px;white-space:nowrap;flex-shrink:0}
.score-high{background:#166534;color:#4ADE80}
.score-med{background:#7c2d12;color:#FB923C}
.score-low{background:#374151;color:#9CA3AF}
.card-industry{font-size:.76rem;color:var(--muted);margin-bottom:7px}
.card-summary{font-size:.8rem;color:#9CA3AF;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.tier-pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px}
.t-strategic{background:rgba(243,112,33,.18);color:var(--orange);border:1px solid rgba(243,112,33,.35)}
.t-trending{background:rgba(0,173,239,.12);color:var(--blue);border:1px solid rgba(0,173,239,.3)}
.t-other{background:rgba(107,114,128,.12);color:#9CA3AF;border:1px solid rgba(107,114,128,.25)}
.opp-count{font-size:.73rem;color:var(--muted)}

/* ── Detail view ── */
.detail-view{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:none}
.detail-view.visible{display:block}
.detail-hdr{background:var(--navy);padding:22px 28px;display:flex;align-items:flex-start;gap:18px;border-bottom:2px solid var(--orange)}
.detail-logo{width:50px;height:50px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:900;color:var(--orange);flex-shrink:0;overflow:hidden}
.detail-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.detail-org{font-size:1.4rem;font-weight:800;color:var(--text);margin-bottom:5px;line-height:1.2}
.detail-summary{font-size:.86rem;color:#9CA3AF;line-height:1.65;max-width:680px}
.detail-right{margin-left:auto;text-align:right;flex-shrink:0}
.score-big{font-size:2.1rem;font-weight:900;color:var(--orange);line-height:1}
.score-big span{font-size:1rem;color:var(--muted)}
.score-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.resell-tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(34,197,94,.12);color:#22C55E;border:1px solid rgba(34,197,94,.3);text-transform:uppercase;letter-spacing:.4px;margin-top:7px;display:inline-block}

.stats-bar{display:flex;background:var(--navy-mid);border-bottom:1px solid var(--border)}
.stat-cell{flex:1;padding:11px 16px;border-right:1px solid var(--border);text-align:center;min-width:0}
.stat-cell:last-child{border-right:none}
.stat-val{font-size:.92rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-lbl{font-size:.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ── Tabs ── */
.tabs-row{display:flex;border-bottom:1px solid var(--border);background:var(--navy-mid);padding:0 22px;overflow-x:auto}
.tab-btn{padding:12px 17px;color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;white-space:nowrap;transition:all .15s;font-family:inherit}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--orange);border-bottom-color:var(--orange)}

.tab-body{padding:24px 28px}

/* ── Shared inner styles ── */
.sec-label{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:10px;margin-top:18px}
.sec-label:first-child{margin-top:0}
.desc-text{font-size:.88rem;color:#9CA3AF;line-height:1.7;margin-bottom:16px}

.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.info-card{background:var(--bg);border-radius:7px;padding:11px 14px;border-left:3px solid var(--orange)}
.info-lbl{font-size:.67rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px;font-weight:600}
.info-val{font-size:.88rem;color:var(--text);line-height:1.4}

.tag-cloud{display:flex;flex-wrap:wrap;gap:7px}
.tech-tag{background:var(--navy);border:1px solid rgba(0,173,239,.3);color:var(--blue);font-size:.78rem;padding:4px 11px;border-radius:12px}

.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.person-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.person-av{width:36px;height:36px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--orange);font-size:.9rem;flex-shrink:0}
.person-name{font-weight:700;font-size:.88rem;color:var(--text)}
.person-title{font-size:.76rem;color:var(--muted);margin-top:2px;line-height:1.4}

.news-list{display:flex;flex-direction:column;gap:9px}
.news-item{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;padding:13px 15px}
.news-hl{font-size:.88rem;font-weight:600;color:var(--text);margin-bottom:3px}
.news-date{font-size:.73rem;color:var(--muted)}
.news-sig{font-size:.8rem;color:#9CA3AF;margin-top:5px;line-height:1.55}

.ma-item{background:var(--bg);border:1px solid var(--border);border-left:3px solid #F59E0B;border-radius:8px;padding:13px 15px;margin-bottom:9px}
.ma-event{font-size:.88rem;font-weight:600;color:var(--text)}
.ma-impl{font-size:.8rem;color:#9CA3AF;margin-top:4px;line-height:1.5}

.opp-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:17px 18px;margin-bottom:13px;transition:border-color .15s}
.opp-card:hover{border-color:var(--orange)}
.opp-hdr{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.opp-title{font-size:.96rem;font-weight:700;color:var(--text);flex:1;min-width:150px}
.opp-score{font-weight:800;font-size:.82rem;padding:3px 10px;border-radius:12px;white-space:nowrap}
.opp-desc{font-size:.86rem;color:#9CA3AF;line-height:1.65;margin-bottom:13px}
.opp-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.opp-field{background:var(--navy-mid);border-radius:6px;padding:8px 11px}
.opp-flbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:3px;font-weight:600}
.opp-fval{font-size:.82rem;color:var(--text);line-height:1.45}
.tags-row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:5px}
.t-lbl{font-size:.73rem;color:var(--muted);margin-right:2px}
.tag{font-size:.73rem;padding:2px 9px;border-radius:10px}
.to{background:rgba(243,112,33,.13);color:var(--orange);border:1px solid rgba(243,112,33,.28)}
.tb{background:rgba(0,173,239,.09);color:var(--blue);border:1px solid rgba(0,173,239,.22)}
.p3-bar{background:linear-gradient(90deg,rgba(243,112,33,.13),rgba(0,173,239,.08));border:1px solid rgba(243,112,33,.28);border-radius:7px;padding:9px 13px;font-size:.8rem;color:var(--orange);margin-top:9px}
.p3-bar strong{color:var(--text)}
.comp-box{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.22);border-radius:6px;padding:7px 11px;font-size:.78rem;color:#F87171;margin-top:8px}

.bullet-list{list-style:none;padding:0}
.bullet-list li{padding:8px 12px 8px 15px;margin-bottom:5px;background:var(--bg);border-radius:6px;border-left:3px solid var(--orange);font-size:.86rem;color:#CBD5E1;line-height:1.5}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-ico{font-size:2.5rem;margin-bottom:10px;opacity:.35}

/* ── Activity log ── */
.activity-log{margin-top:14px;max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.log-line{display:flex;gap:9px;align-items:baseline;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-ts{font-size:.7rem;color:var(--muted);opacity:.55;flex-shrink:0;font-variant-numeric:tabular-nums}
.log-msg{font-size:.78rem;color:#9CA3AF;line-height:1.4}
.log-line.hl .log-msg{color:var(--orange)}
.log-line.ok .log-msg{color:#22C55E}

/* ── Partial/pending state ── */
.pending-banner{display:flex;align-items:center;gap:10px;background:rgba(243,112,33,.08);border:1px solid rgba(243,112,33,.25);border-radius:8px;padding:14px 18px;margin-bottom:18px;font-size:.86rem;color:var(--orange)}

/* ── Sources tab ── */
.source-section{margin-bottom:22px}
.source-badge{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 11px;font-size:.76rem;color:var(--muted);margin-bottom:10px}
.source-badge.active{border-color:var(--orange);color:var(--orange)}
.tavily-query{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin-bottom:10px}
.tavily-q-label{font-size:.76rem;font-weight:700;color:var(--text);margin-bottom:6px}
.tavily-q-answer{font-size:.8rem;color:#9CA3AF;line-height:1.6;margin-bottom:8px}
.source-link-list{display:flex;flex-direction:column;gap:4px}
.source-link{font-size:.76rem;color:var(--blue);display:flex;align-items:baseline;gap:6px;line-height:1.45}
.source-link:hover{color:#7DD3FC}
.source-link-date{font-size:.68rem;color:var(--muted);flex-shrink:0}

.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── Tech Stack categorised ── */
.tech-cat-grid{display:flex;flex-direction:column;gap:18px}
.tech-cat-header{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.tech-cat-header::after{content:'';flex:1;height:1px;background:var(--border)}
.tech-cards-row{display:flex;flex-wrap:wrap;gap:8px}
.tech-card{border:1px solid;border-radius:8px;padding:8px 12px;min-width:160px;max-width:300px}
.tech-card-name{font-size:.85rem;font-weight:700;margin-bottom:3px}
.tech-card-rel{font-size:.75rem;color:var(--muted);line-height:1.45}

@media(max-width:768px){
  .form-row{flex-direction:column}
  .info-grid{grid-template-columns:1fr 1fr}
  .two-col{grid-template-columns:1fr}
  .opp-grid{grid-template-columns:1fr}
  .stats-bar{flex-wrap:wrap}
  .stat-cell{min-width:50%}
}
</style>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────── -->
<nav class="navbar">
  <img class="navbar-logo"
       src="https://www.hcltech.com/themes/custom/hcltech/images/hcltech-new-logo.svg"
       onerror="this.style.display='none'" alt="HCLTech">
  <div class="navbar-divider"></div>
  <div>
    <div class="navbar-title">Sales Intelligence</div>
    <div class="navbar-sub">Digital Business Services · APAC</div>
  </div>
  <div class="navbar-spacer"></div>
  <div class="health-group">
    <div class="health-item"><div class="health-dot" id="h-claude"></div>Claude</div>
    <div class="health-item"><div class="health-dot" id="h-tavily"></div>Tavily</div>
    <div class="health-item"><div class="health-dot" id="h-apollo"></div>Apollo</div>
  </div>
</nav>

<!-- ── Main ───────────────────────────────────────────────────── -->
<div class="main">

  <!-- Input panel -->
  <div class="panel" id="inputPanel">
    <div class="panel-title">Research Target</div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="single"   onclick="switchMode('single')">Single Org</button>
      <button class="mode-tab"        data-mode="bulk"     onclick="switchMode('bulk')">Bulk (up to 20)</button>
      <button class="mode-tab"        data-mode="industry" onclick="switchMode('industry')">Industry Sweep</button>
    </div>

    <!-- Single -->
    <div id="form-single">
      <div class="form-row">
        <div class="form-group" style="flex:2">
          <label class="form-label" for="singleOrg">Organisation Name</label>
          <input class="form-input" id="singleOrg"
                 placeholder="e.g. Commonwealth Bank of Australia" autocomplete="off">
        </div>
      </div>
    </div>

    <!-- Bulk -->
    <div id="form-bulk" style="display:none">
      <div class="form-group">
        <label class="form-label" for="bulkOrgs">Organisation Names — one per line (max 20)</label>
        <textarea class="form-textarea" id="bulkOrgs"
                  placeholder="Commonwealth Bank of Australia&#10;Telstra&#10;Woolworths Group&#10;BHP Group"></textarea>
        <p class="form-hint">Each line is one organisation. Duplicates and blank lines are removed automatically.</p>
      </div>
    </div>

    <!-- Industry -->
    <div id="form-industry" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="industryName">Industry / Sector</label>
          <input class="form-input" id="industryName"
                 placeholder="e.g. Financial Services, Retail, Utilities">
        </div>
        <div class="form-group">
          <label class="form-label" for="regionName">Region (optional)</label>
          <input class="form-input" id="regionName"
                 placeholder="e.g. Australia, ANZ, APAC">
        </div>
      </div>
      <p class="form-hint">Claude will discover up to 20 leading companies in the sector, then analyse each one.</p>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-top:6px">
      <button class="btn btn-primary" id="analyzeBtn" onclick="handleAnalyze()">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
        </svg>
        Analyse
      </button>
      <span id="apiMsg" style="font-size:.78rem;color:var(--muted)"></span>
    </div>
  </div>

  <!-- Progress panel -->
  <div class="panel progress-panel" id="progressPanel">
    <div class="progress-head">
      <div class="progress-title" id="progTitle">Analysing…</div>
      <div class="progress-count" id="progCount"></div>
    </div>
    <div class="prog-bar-outer">
      <div class="prog-bar-inner" id="progBar" style="width:0%"></div>
    </div>
    <div class="chip-list" id="chipList"></div>
    <div class="activity-log" id="activityLog"></div>
  </div>

  <!-- Results -->
  <div id="resultsSection" style="display:none">
    <div class="results-head">
      <div class="results-title" id="resultsTitle"></div>
      <div class="export-bar" id="exportBar"></div>
    </div>

    <!-- Multi-org grid -->
    <div class="org-grid" id="orgGrid"></div>

    <!-- Single-org detail -->
    <div class="detail-view" id="detailView">
      <div class="detail-hdr"  id="detailHdr"></div>
      <div class="stats-bar"   id="statsBar"></div>
      <div class="tabs-row"    id="tabsRow"></div>
      <div class="tab-body"    id="tabBody"></div>
    </div>
  </div>

</div><!-- /main -->

<script>
// ── STATE ─────────────────────────────────────────────────────
const S = {
  mode:           'single',
  analyzing:      false,

// ── ANALYZE ───────────────────────────────────────────────────
async function handleAnalyze() {
  if (S.analyzing) return;

  let orgs = [], industry = '', region = '';

  if (S.mode === 'single') {
    const v = document.getElementById('singleOrg').value.trim();
    if (!v) { document.getElementById('singleOrg').focus(); return; }
    orgs = [v];
  } else if (S.mode === 'bulk') {
    orgs = [...new Set(
      document.getElementById('bulkOrgs').value
        .split('\n').map(s => s.trim()).filter(Boolean)
    )].slice(0, 20);
    if (!orgs.length) { document.getElementById('bulkOrgs').focus(); return; }
  } else {
    industry = document.getElementById('industryName').value.trim();
    region   = document.getElementById('regionName').value.trim();
    if (!industry) { document.getElementById('industryName').focus(); return; }
  }

  // Reset state
  S.results.clear();
  S.statuses.clear();
  S.sources.clear();
  S.selectedOrg    = null;
  S.activeTab      = 'overview';
  S.done           = 0;
  S.total          = orgs.length;
  S.analyzing      = true;
  S.streamComplete = false;

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="border-color:#fff;border-top-color:transparent;width:13px;height:13px"></div> Analysing…';
  document.getElementById('apiMsg').textContent = '';

  // Show progress, hide results
  const pp = document.getElementById('progressPanel');
  pp.classList.add('visible');
  document.getElementById('resultsSection').style.display = 'none';
  document.getElementById('chipList').innerHTML   = '';
  document.getElementById('activityLog').innerHTML = '';
  document.getElementById('progBar').style.width   = '0%';
  document.getElementById('progTitle').style.color = '';
  document.getElementById('progTitle').textContent =
    S.mode === 'industry' ? `Discovering companies in ${industry}…` : 'Analysing…';
  document.getElementById('progCount').textContent = '';

  try {
    const body = { mode: S.mode };
    if (S.mode === 'industry') { body.industry = industry; body.region = region; }
    else { body.orgs = orgs; }

    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    // Parse SSE from streaming POST response
    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    const flush = () => {
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete line
      let evType = '', evData = '';
      for (const line of lines) {
        if (line.startsWith('event: '))      evType = line.slice(7).trim();
        else if (line.startsWith('data: '))  evData = line.slice(6);
        else if (line === '' && evType) {
          try { onSSE(evType, JSON.parse(evData)); } catch {}
          evType = ''; evData = '';
        }
      }
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      flush();
      if (S.streamComplete) break;  // server sent 'done' event; exit without waiting for TCP close
    }

  } catch (err) {
    document.getElementById('progTitle').textContent = `Error: ${err.message}`;
    document.getElementById('progTitle').style.color = '#EF4444';
    document.getElementById('apiMsg').textContent = err.message;
  } finally {
    S.analyzing = false;
    btn.disabled = false;
    btn.innerHTML = '<svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg> Analyse';
  }
}

// ── SSE EVENT ROUTER ──────────────────────────────────────────
function onSSE(type, data) {
  switch (type) {

    case 'status':
      document.getElementById('progTitle').textContent = data.message;
      addLog(data.message);
      break;

    case 'discovered':
      S.total = data.orgs.length;
      document.getElementById('progTitle').textContent =
        `Discovered ${data.orgs.length} organisations — analysing…`;
      addLog(`Discovered ${data.orgs.length} organisations: ${data.orgs.slice(0,5).join(', ')}${data.orgs.length > 5 ? '…' : ''}`, 'hl');
      break;

    case 'start':
      S.total = data.total;
      updateProgress();
      addLog(`Starting analysis of ${data.total} organisation${data.total !== 1 ? 's' : ''}…`);
      break;

    case 'progress':
      S.statuses.set(data.org, data.status);
      renderChips();
      if (data.message) addLog(data.message);
      break;

    case 'research_data': {
      // Store sources for the Sources tab
      S.sources.set(data.org, data.sources);

      // Build partial result to show immediately while Claude analyses
      const partial = {
        orgName:          data.org,
        _partial:         true,
        _jobItems:        data.jobItems || [],
        logoUrl:          data.profile?.logo || null,
        website:          data.profile?.website || null,
        executiveSummary: '⏳ Claude Opus 4.7 is reasoning — opportunities and GTM brief loading…',
        overallScore:     null,
        profile:          data.profile || {},
        techStack:        data.techStack || [],
        leadership:       data.leadership || [],
        recentNews:       (data.newsItems || []).map(n => ({
          headline:    n.title,
          url:         n.url,
          date:        n.date || null,
          significance:'Full analysis loading…',
        })),
        maActivity:    [],
        jobSignals:    [],
        opportunities: [],
        talkingPoints: [],
        nextActions:   [],
      };
      S.results.set(data.org, partial);

      const techCount = data.techStack?.length || 0;
      const contactCount = data.leadership?.length || 0;
      const newsCount = data.newsItems?.length || 0;
      addLog(`Research done for ${data.org} — ${techCount} tech items, ${contactCount} contacts, ${newsCount} news items found`, 'hl');

      // Show partial immediately
      if (!S.selectedOrg) S.selectedOrg = data.org;
      renderResults();
      if (S.selectedOrg === data.org) renderDetail();
      break;
    }

    case 'result':
      S.statuses.set(data.org, 'done');
      S.results.set(data.org, data.data);   // replaces partial with full result
      S.done++;
      updateProgress();
      renderChips();
      renderResults();
      // Re-render detail if this org is currently selected
      if (S.selectedOrg === data.org) renderDetail();
      else if (!S.selectedOrg) { S.selectedOrg = data.org; renderDetail(); }
      addLog(`✓ Full analysis ready for ${data.org}`, 'ok');
      break;

    case 'error':
      document.getElementById('progTitle').textContent = `Error: ${data.message}`;
      document.getElementById('progTitle').style.color = '#EF4444';
      addLog(`Error: ${data.message}`);
      break;

    case 'done':
      S.streamComplete = true;
      document.getElementById('progBar').style.width   = '100%';
      document.getElementById('progTitle').textContent =
        `Analysis complete — ${data.total} organisation${data.total !== 1 ? 's' : ''}`;
      document.getElementById('progTitle').style.color = '#22C55E';
      addLog(`✓ All done — ${data.total} org${data.total !== 1 ? 's' : ''} analysed`, 'ok');
      break;
  }
}

// ── PROGRESS HELPERS ──────────────────────────────────────────
function updateProgress() {
  const pct = S.total ? Math.round((S.done / S.total) * 100) : 0;
  document.getElementById('progBar').style.width = `${pct}%`;
  document.getElementById('progCount').textContent =
    S.total ? `${S.done} / ${S.total}` : '';
}

function renderChips() {
  document.getElementById('chipList').innerHTML =
    [...S.statuses.entries()].map(([org, st]) => `
      <div class="chip ${st}">
        ${st === 'done' ? '✓' : st === 'error' ? '✗' : '<div class="spinner"></div>'}
        ${esc(org)} <span style="opacity:.55">${st}</span>
      </div>`).join('');
}

// ── RESULTS LAYOUT ────────────────────────────────────────────
function renderResults() {
  const rs = document.getElementById('resultsSection');
  rs.style.display = 'block';

  const all = [...S.results.values()];
  document.getElementById('resultsTitle').textContent =
    all.length === 1 ? all[0].orgName : `${all.length} Organisations Analysed`;

  renderExportBar(all);

  if (all.length > 1) renderOrgGrid();
  else document.getElementById('orgGrid').innerHTML = '';
}

// ── ORG GRID ─────────────────────────────────────────────────
function renderOrgGrid() {
  const all = [...S.results.values()];
  document.getElementById('orgGrid').innerHTML = all.map(r => {
    const top   = r.opportunities?.[0];
    const score = r.overallScore || 0;
    const sc    = score >= 8 ? 'score-high' : score >= 5 ? 'score-med' : 'score-low';
    const tc    = tierClass(top?.partnerTier);
    const sel   = S.selectedOrg === r.orgName ? 'selected' : '';
    return `
    <div class="org-card ${sel}" onclick="selectOrg(${JSON.stringify(r.orgName)})">
      <div class="card-top">
        <div class="card-name">${esc(r.orgName)}</div>
        <div class="score-pill ${sc}">${score}/10</div>
      </div>
      <div class="card-industry">${esc(r.profile?.industry || '')}</div>
      <div class="card-summary">${esc(r.executiveSummary || '')}</div>
      <div class="card-footer">
        ${top ? `<span class="tier-pill ${tc}">${esc(top.partnerTier || 'Other')}</span>` : ''}
        <span class="opp-count">${r.opportunities?.length || 0} opp${(r.opportunities?.length || 0) !== 1 ? 's' : ''}</span>
      </div>
    </div>`;
  }).join('');
}

function tierClass(pt) {
  if (!pt) return 't-other';
  if (pt.includes('Strategic')) return 't-strategic';
  if (pt.includes('Trending'))  return 't-trending';
  return 't-other';
}

// ── ORG SELECTION ─────────────────────────────────────────────
function selectOrg(orgName) {
  S.selectedOrg = orgName;
  renderOrgGrid();   // re-render to update .selected class
  renderDetail();
}

function selectTab(tab) {
  S.activeTab = tab;

  }

// ── SECURITY HELPER ───────────────────────────────────────────
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── DETAIL VIEW ───────────────────────────────────────────────
function renderDetail() {
  if (!S.selectedOrg) return;
  const r = S.results.get(S.selectedOrg);
  if (!r) return;

  const dv = document.getElementById('detailView');
  dv.classList.add('visible');

  // Header
  const initials = (r.orgName || '?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();

      <div class="detail-org">${esc(r.orgName)}</div>
      ${r.website ? `<a href="${esc(r.website)}" target="_blank" rel="noopener"
          style="font-size:.76rem;color:var(--blue)">${esc(r.website)}</a>` : ''}
      <div class="detail-summary" style="margin-top:7px">${esc(r.executiveSummary || '')}</div>
    </div>
    <div class="detail-right">
      <div class="score-big score-pill ${sc}" style="background:none;padding:0;font-size:2.1rem">
        ${score}<span style="font-size:1rem;color:var(--muted)">/10</span>
      </div>
      <div class="score-lbl">Opportunity Score</div>
      ${hasResell ? '<div class="resell-tag">Resell opportunity</div>' : ''}
    </div>`;

  // Stats bar
  const stats = [
    ['Industry',      r.profile?.industry  || '—'],
    ['Employees',     r.profile?.employees || '—'],
    ['Revenue',       r.profile?.revenue   || '—'],
    ['HQ',            r.profile?.hq        || '—'],
    ['Opportunities', r.opportunities?.length ?? 0],
    ['Technologies',  r.techStack?.length  ?? 0],
  ];
  document.getElementById('statsBar').innerHTML = stats.map(([l,v]) =>
    `<div class="stat-cell"><div class="stat-val">${esc(String(v))}</div><div class="stat-lbl">${l}</div></div>`
  ).join('');

  // Tabs
  const hasSources = S.sources.has(S.selectedOrg);
  const tabs = [
    { id: 'overview',      label: 'Overview' },
    { id: 'opportunities', label: r._partial ? '⏳ Opportunities' : `Opportunities (${r.opportunities?.length || 0})` },
    { id: 'techstack',     label: `Tech Stack (${r.techStack?.length || 0})` },
    { id: 'leadership',    label: `Leadership (${r.leadership?.length || 0})` },
    { id: 'intelligence',  label: `Intelligence (${(r.recentNews?.length||0)+(r.maActivity?.length||0)+(r.jobSignals?.length||0)})` },
    ...(hasSources ? [{ id: 'sources', label: '🔬 Sources' }] : []),
  ];
  document.getElementById('tabsRow').innerHTML = tabs.map(t =>
    `<button class="tab-btn ${S.activeTab===t.id?'active':''}" data-tab="${t.id}"
             onclick="selectTab('${t.id}')">${t.label}</button>`
  ).join('');

  renderTabBody();
  dv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── TAB BODY DISPATCHER ───────────────────────────────────────
function renderTabBody() {
  const r  = S.results.get(S.selectedOrg);
  if (!r) return;
  const el = document.getElementById('tabBody');
  el.classList.remove('fade-in');
  void el.offsetWidth;
  el.classList.add('fade-in');
  switch (S.activeTab) {
    case 'overview':      el.innerHTML = tabOverview(r);                              break;
    case 'opportunities': el.innerHTML = tabOpportunities(r);                         break;
    case 'techstack':     el.innerHTML = tabTechStack(r);                             break;
    case 'leadership':    el.innerHTML = tabLeadership(r);                            break;
    case 'intelligence':  el.innerHTML = tabIntelligence(r);                          break;
    case 'sources':       el.innerHTML = tabSources(S.sources.get(S.selectedOrg));    break;
  }
}

      ${r._partial ? `<div class="pending-banner">
        <div class="spinner" style="border-color:var(--orange);border-top-color:transparent;width:14px;height:14px;flex-shrink:0"></div>
        <div>Tech stack sourced from Apollo.io. Claude is categorising and adding GTM context — this view will update when analysis completes.</div>
      </div>` : ''}
      <div class="sec-label">Technology Stack — ${r.techStack.length} technologies</div>
      <div class="tag-cloud">${r.techStack.map(t=>`<span class="tech-tag">${esc(String(t))}</span>`).join('')}</div>`;
  }

  // Rich objects from Claude — group by category
  const groups = {};
  for (const t of r.techStack) {
    const cat = t.category || 'Other';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(t);
  }
  const orderedCats = CAT_ORDER.filter(c => groups[c])
    .concat(Object.keys(groups).filter(c => !CAT_ORDER.includes(c)));

  const groupsHtml = orderedCats.map(cat => {
    const col   = TECH_CAT_COLORS[cat] || TECH_CAT_COLORS.Other;
    const cards = groups[cat].map(t => `
      <div class="tech-card" style="background:${col.bg};border-color:${col.border}">
        <div class="tech-card-name" style="color:${col.text}">${esc(t.name)}</div>
        ${t.relevance ? `<div class="tech-card-rel">${esc(t.relevance)}</div>` : ''}
      </div>`).join('');
    return `
      <div>
        <div class="tech-cat-header" style="color:${col.text}">${cat} <span style="font-weight:400;opacity:.55">(${groups[cat].length})</span></div>
        <div class="tech-cards-row">${cards}</div>
      </div>`;
  }).join('');

  return `
    <div class="sec-label" style="margin-bottom:16px">
      Technology Stack — ${r.techStack.length} technologies · categorised &amp; contextualised by Claude Opus 4.7
    </div>
    <div class="tech-cat-grid">${groupsHtml}</div>`;
}

// ── TAB: LEADERSHIP ───────────────────────────────────────────
function tabLeadership(r) {
  if (!r.leadership?.length)
    return `<div class="empty"><div class="empty-ico">👤</div>No leadership data available</div>`;
  const cards = r.leadership.map(p => {
    const av = (p.name||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
    return `
    <div class="person-card">
      <div class="person-av">${av}</div>
      <div>
        <div class="person-name">${esc(p.name||'—')}</div>
        <div class="person-title">${esc(p.title||'—')}</div>
        ${p.linkedin
          ? `<a href="${esc(p.linkedin)}" target="_blank" rel="noopener"
               style="font-size:.73rem;color:var(--blue);margin-top:4px;display:inline-block">LinkedIn →</a>`
          : ''}
      </div>
    </div>`;
  }).join('');
  return `
    <div class="sec-label">Key Contacts — ${r.leadership.length} identified</div>
    <div class="people-grid">${cards}</div>`;
}

// ── TAB: INTELLIGENCE ─────────────────────────────────────────
function tabIntelligence(r) {
  let html = '';

  // ── Market Signals (job postings) ──
  if (r.jobSignals?.length) {
    // Full Claude-analysed signals
    const urgencyColour = u => u === 'high' ? '#EF4444' : u === 'medium' ? '#F59E0B' : '#6B7280';
    const cards = r.jobSignals.map(s => `
      <div class="news-item" style="border-left-color:#8B5CF6">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <div class="news-hl" style="flex:1">${esc(s.rolePattern)}</div>
          ${s.urgency ? `<span style="font-size:.7rem;font-weight:700;color:${urgencyColour(s.urgency)};text-transform:uppercase;letter-spacing:.5px">${esc(s.urgency)}</span>` : ''}
        </div>
        <div class="tags-row" style="margin-bottom:6px">
          ${(s.techFocus||[]).map(t=>`<span class="tag" style="background:rgba(139,92,246,.12);color:#A78BFA;border:1px solid rgba(139,92,246,.3)">${esc(t)}</span>`).join('')}
        </div>
        <div class="news-sig">${esc(s.signal)}</div>
        ${s.hclRelevance ? `<div style="margin-top:6px;font-size:.79rem;color:var(--orange)">→ HCLTech angle: ${esc(s.hclRelevance)}</div>` : ''}
      </div>`).join('');
    html += `<div class="sec-label">📡 Market Signals — Tech Hiring Patterns (${r.jobSignals.length})</div>
             <div class="news-list">${cards}</div>`;
  } else if (r._partial && r._jobItems?.length) {
    // Partial state — show raw job posting links
    const links = r._jobItems.map(j => `
      <div class="news-item" style="border-left-color:#8B5CF6">
        <div class="news-hl">${esc(j.title)}</div>
        ${j.date ? `<div class="news-date">${esc(j.date)}</div>` : ''}
        ${j.content ? `<div class="news-sig">${esc(j.content)}</div>` : ''}
        ${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener"
            style="font-size:.73rem;color:var(--blue);margin-top:5px;display:inline-block">🔗 View posting →</a>` : ''}
      </div>`).join('');
    html += `<div class="sec-label">📡 Tech Hiring Signals — raw data (Claude analysis loading…)</div>
             <div class="news-list">${links}</div>`;
  }

  // ── News ──
  if (r.recentNews?.length) {
    const items = r.recentNews.map(n => `
      <div class="news-item">
        <div class="news-hl">${esc(n.headline)}</div>
        ${n.date ? `<div class="news-date">${esc(n.date)}</div>` : ''}
        <div class="news-sig">${esc(n.significance)}</div>
        ${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener"
            style="font-size:.73rem;color:var(--blue);margin-top:5px;display:inline-block">🔗 Read source →</a>` : ''}
      </div>`).join('');
    html += `<div class="sec-label" style="margin-top:${html ? 22 : 0}px">Recent News & Developments (${r.recentNews.length})</div>
             <div class="news-list">${items}</div>`;
  }

  // ── M&A ──
  if (r.maActivity?.length) {
    const items = r.maActivity.map(m => `
      <div class="ma-item">
        <div class="ma-event">${esc(m.event)}</div>
        ${m.date ? `<div class="news-date">${esc(m.date)}</div>` : ''}
        <div class="ma-impl">${esc(m.implication)}</div>
      </div>`).join('');
    html += `<div class="sec-label" style="margin-top:22px">M&amp;A Activity (${r.maActivity.length})</div>${items}`;
  }

  return html ||
    `<div class="empty"><div class="empty-ico">📰</div>No intelligence data available</div>`;
}

// ── TAB: SOURCES (under-the-hood peek) ───────────────────────
function tabSources(src) {
  if (!src) return `<div class="empty"><div class="empty-ico">🔬</div>No source data available</div>`;

  let html = `<div class="sec-label">Data Sources Used</div>`;

  // Apollo badge
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">
    <span class="source-badge ${src.apolloUsed ? 'active' : ''}">
      ${src.apolloUsed ? '✓' : '✗'} Apollo.io firmographics
    </span>
    <span class="source-badge active">✓ Tavily deep web search (5 queries)</span>
    <span class="source-badge active">✓ Claude Opus 4.7 synthesis</span>
  </div>`;

  // Apollo detail
  if (src.apolloUsed && src.apolloOrg) {
    html += `<div class="source-section">
      <div class="sec-label">Apollo.io — Organisation Profile</div>
      <div class="tavily-query">
        <div class="tavily-q-label">${esc(src.apolloOrg.name || '')}</div>
        <div class="source-link-list">
          ${src.apolloOrg.website ? `<a href="${esc(src.apolloOrg.website)}" target="_blank" rel="noopener" class="source-link">🔗 ${esc(src.apolloOrg.website)}</a>` : ''}
          ${src.apolloOrg.linkedin ? `<a href="${esc(src.apolloOrg.linkedin)}" target="_blank" rel="noopener" class="source-link">🔗 LinkedIn profile</a>` : ''}
        </div>
      </div>
    </div>`;
  }

  // Tavily queries
  if (src.tavilyQueries?.length) {
    html += `<div class="source-section"><div class="sec-label">Tavily — Web Research Queries</div>`;
    html += src.tavilyQueries.map(q => {
      const links = (q.results || []).map(r =>
        `<a href="${esc(r.url)}" target="_blank" rel="noopener" class="source-link">
          🔗 ${esc(r.title)}
          ${r.date ? `<span class="source-link-date">${esc(r.date)}</span>` : ''}
        </a>`
      ).join('');
      return `<div class="tavily-query">
        <div class="tavily-q-label">${esc(q.label)}</div>
        ${q.answer ? `<div class="tavily-q-answer">${esc(q.answer)}</div>` : ''}
        <div class="source-link-list">${links || '<span style="font-size:.75rem;color:var(--muted)">No URLs returned</span>'}</div>
      </div>`;
    }).join('');
    html += `</div>`;
  }

  return html;
}

// ── EXPORTS ───────────────────────────────────────────────────
async function exportExcel() {
  const results = [...S.results.values()];
  if (!results.length) return;
  const btn = event?.currentTarget;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Generating…'; }
  try {
    const res = await fetch('/api/export/excel', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ results }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    downloadBlob(await res.blob(),
      `HCLTech-Sales-Intelligence-${isoDate()}.xlsx`);
  } catch (err) {
    alert(`Export failed: ${err.message}`);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '📊 Export Excel'; }
  }
}

async function exportBrief(format) {
  if (!S.selectedOrg) return;
  const result = S.results.get(S.selectedOrg);
  if (!result) return;
  const btn = event?.currentTarget;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Building…'; }
  try {
    const res = await fetch('/api/export/brief', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ result, format }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const safe = result.orgName.replace(/[^a-z0-9]/gi, '_');
    const ext  = format === 'text' ? 'txt' : 'html';
    const label = format === 'text' ? 'Brief' : 'Slides';
    downloadBlob(await res.blob(), `${safe}-${label}.${ext}`);
  } catch (err) {
    alert(`Export failed: ${err.message}`);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = format === 'text' ? '📄 Text Brief' : '🖨 Slide Deck';
    }
  }
}

async function exportPptx() {
  if (!S.selectedOrg) return;
  const result = S.results.get(S.selectedOrg);
  if (!result) return;
  const btn = event?.currentTarget;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Building PPTX…'; }
  try {
    const res = await fetch('/api/export/pptx', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ result }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const safe = result.orgName.replace(/[^a-z0-9]/gi, '_');
    downloadBlob(await res.blob(), `${safe}-GTM-Brief.pptx`);
  } catch (err) {
    alert(`PPTX export failed: ${err.message}`);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '📊 Export PPTX'; }
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a   = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function isoDate() {
  return new Date().toISOString().slice(0, 10);
}
// ── END ───────────────────────────────────────────────────────
</script>
